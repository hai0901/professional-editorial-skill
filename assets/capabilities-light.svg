0" font-size="15.5" fill="#59636e">Claims no stronger than the evidence</text><rect x="24" y="572" width="448" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><g transform="translate(45 588) scale(1.2)" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 7.2 0 1 1 3.4 5.9L3.5 19.5l1.2-3.6A6.9 6.9 0 0 1 4 12z"/></g><text x="46" y="642" font-size="20" font-weight="600" fill="#1f2328">Voice</text><text x="46" y="668" font-size="15.5" fill="#59636e">Plain and precise, without inflation</text><rect x="488" y="572" width="448" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><g transform="translate(509 588) scale(1.2)" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5L9 20H4v-5z"/><path d="M12.5 6.5l5 5M13 20h7"/></g><text x="510" y="642" font-size="20" font-weight="600" fill="#1f2328">Restraint</text><text x="510" y="668" font-size="15.5" fill="#59636e">Know when to edit and when to leave it</text><rect x="24" y="700" width="448" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><g transform="translate(45 716) scale(1.2)" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/></g><text x="46" y="770" font-size="20" font-weight="600" fill="#1f2328">Modes</text><text x="46" y="796" font-size="15.5" fill="#59636e">Author, proofread, rewrite, audit, summarize, translate</text><rect x="488" y="700" width="448" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><g transform="translate(509 716) scale(1.2)" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="16.5" rx="2"/><rect x="9" y="2.8" width="6" height="3.4" rx="1"/><path d="M8.8 13.3l2.3 2.3 4.4-4.6"/></g><text x="510" y="770" font-size="20" font-weight="600" fill="